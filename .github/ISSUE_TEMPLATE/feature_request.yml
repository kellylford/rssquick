name: Feature request
description: Suggest something RSS Quick should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution — it often turns out there is a better fit than the feature first imagined.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like RSS Quick to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
