version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - kellylford
    assignees:
      - kellylford
    groups:
      # The test stack moves together; one PR rather than five.
      test-tooling:
        patterns:
          - "xunit*"
          - "Xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
      # The Velopack library reads what the vpk tool writes, so a release built by one version
      # of vpk must be read by the same version of the library. Never merge one without the
      # other; vpk is pinned in .config/dotnet-tools.json, which this ecosystem also updates.
      velopack:
        patterns:
          - "Velopack"
          - "vpk"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - kellylford
    assignees:
      - kellylford
