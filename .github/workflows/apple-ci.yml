name: Apple CI

# Tests the macOS version and builds the iOS version on every pull request, so Swift that has
# only been written on Windows is compiled before it reaches a Mac. ci.yml does the same for the
# Windows build. Nothing here signs, archives or uploads: macos-release.yml and
# ios/scripts/release-testflight.sh do that, and neither needs to run for a change to be proven.

# No paths filter, deliberately. Both jobs are required checks on main, and a required check that
# a filter skips never reports, which leaves a Windows-only pull request waiting forever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    name: macOS tests
    # Pinned to match macos-release.yml, so a change that passes here builds with the same Xcode
    # the release will use.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Includes the focus and tab-order tests, which build real windows. They read first
      # responder rather than the key window, so they need no screen in front of them.
      - name: Test
        run: swift test --package-path macos

  ios-build:
    name: iOS build
    # The iOS app compiles macos/Sources/RSSQuickCore straight in, and the committed .xcodeproj
    # lists every source file. A file added to the core but not to the project passes the macOS
    # tests and fails only here.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The project targets the iOS 27 toolchain (see the ENABLE_DEBUG_DYLIB note in
      # ios/project.yml), which the runner's default Xcode may predate.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      # A simulator destination needs no signing identity and no secrets, so a fork or a branch
      # build works without any repository configuration.
      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/RSSQuick.xcodeproj \
            -scheme RSSQuick \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
