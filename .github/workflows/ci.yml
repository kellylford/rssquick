name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # WPF needs a Windows runner; net10.0-windows will not build anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RSSQuick.sln

      - name: Build
        run: dotnet build RSSQuick.sln --configuration Release --no-restore

      # The focus tests create real WPF windows. They read logical focus rather than keyboard
      # focus precisely so they do not need the window to be foreground, which it never is here.
      #
      # Microsoft.Testing.Platform switches, not VSTest ones: global.json selects the MTP runner,
      # where the project is passed with --project and reporting is --report-xunit-trx rather than
      # --logger trx. The VSTest spellings are silently ignored rather than failing loudly.
      - name: Test
        run: >
          dotnet test --project tests/RSSQuick.Tests/RSSQuick.Tests.csproj
          --configuration Release
          --no-build
          --
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx
          --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
