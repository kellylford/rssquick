name: iOS TestFlight Release

# Builds RSS Quick for iPhone and iPad on a GitHub-hosted Mac, uploads it to App Store Connect,
# and puts it in front of external testers: the "Public Testers" TestFlight group, created with a
# public link if it does not exist, with the build submitted for Beta App Review.
#
# It runs on the same v* tag as release.yml and macos-release.yml, so the iPhone and iPad version
# goes out with the same version number as Windows and the Mac - VERSION, as everywhere else. It
# can also be run by hand from the Actions tab, for the version VERSION holds on the branch run.
#
# Built here rather than on the Mac on purpose: GitHub's runners are on released macOS and Xcode,
# and Apple rejects App Store builds made on a beta macOS. Ported from Scores' ios-release.yml,
# which has shipped that way; see README-ios-release.md there for how its secrets were made.
#
# Repository secrets:
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8
#       The App Store Connect API key the macOS release already uses (NOTARY_KEY_P8 is the .p8,
#       base64-encoded). It needs the App Manager or Admin role to manage TestFlight groups and
#       submit for review.
#   IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD
#       The "Apple Distribution" certificate and its private key, exported as a .p12 and
#       base64-encoded, and the password it was exported with. Not the Developer ID certificate
#       the Mac build signs with. ios/README.md has the commands.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      distribute:
        description: 'After uploading, add the build to Public Testers and submit it for Beta App Review'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Apple rejects on BuildMachineOSBuild. Released macOS builds end in a digit, beta seeds in
      # a lowercase letter. GitHub's runners are released, so this only guarantees it stays so.
      - name: Refuse a beta build machine
        run: |
          set -euo pipefail
          xcodebuild -version
          os_build="$(sw_vers -buildVersion)"
          echo "macOS build: $os_build"
          if printf '%s' "$os_build" | grep -qE '[a-z]$'; then
            echo "::error::The runner is on a beta macOS ($os_build); the App Store would reject this build."
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Stage the App Store Connect key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$dir/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$dir/AuthKey_${NOTARY_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Set up the App Store Connect script
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography requests

      # One more than the highest build number App Store Connect has seen, so a build here can
      # never collide with one uploaded by hand from a Mac.
      - name: Choose the build number
        id: build
        env:
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          number="$("$RUNNER_TEMP/asc/bin/python" ios/scripts/asc.py next-build-number)"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Build $number"

      - name: Import the distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security list-keychains -d user -s "$keychain" "$(security default-keychain | tr -d ' "')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/RSSQuick.xcodeproj \
            -scheme RSSQuick \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RSSQuick.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.build.outputs.number }}" \
            clean archive

      - name: Export the .ipa
        env:
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RSSQuick.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/scripts/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lh "$RUNNER_TEMP/export/"

      - name: Validate and upload
        env:
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error::No .ipa was produced."; exit 1; }
          xcrun altool --validate-app -t ios -f "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -t ios -f "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # The version's CHANGELOG section, as TestFlight's "What to Test".
      - name: Write the release notes
        if: github.event_name == 'push' || inputs.distribute
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v v="## [$version]" 'index($0, v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/whats-new.txt"
          [ -s "$RUNNER_TEMP/whats-new.txt" ] || echo "RSS Quick $version" > "$RUNNER_TEMP/whats-new.txt"
          wc -c "$RUNNER_TEMP/whats-new.txt"

      - name: Send to external testers
        if: github.event_name == 'push' || inputs.distribute
        env:
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          "$RUNNER_TEMP/asc/bin/python" ios/scripts/asc.py distribute \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.build.outputs.number }}" \
            --whats-new "$RUNNER_TEMP/whats-new.txt" \
            --timeout 75

      - name: Keep the .ipa
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RSSQuick-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
