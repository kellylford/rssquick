name: macOS Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Notarize and staple (off produces a signed but unpublishable image)'
        type: boolean
        default: true

permissions:
  contents: write   # attach the disk image to the draft release

jobs:
  package:
    # Pinned rather than macos-latest. The Swift package declares swift-tools-version 6.0, so the
    # runner's Xcode is a build dependency, and a silent image bump is not something a release
    # workflow should discover on the day of a release.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # Never ship a build the tests have not passed. release.sh runs them too; this is here so a
      # test failure is its own red step rather than something to find inside a long log.
      - name: Test
        run: swift test --package-path macos

      # The tag is authoritative: a v1.2.0 tag must not publish an image stamped 1.1.0.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "Tag v$tag does not match VERSION ($file). Run build/prepare-release.ps1 $tag and re-tag." >&2
            exit 1
          fi
          echo "Version $file"

      # A throwaway keychain, so the signing key never joins the runner's login keychain and goes
      # away with the runner regardless of how the job ends. Its password is generated here rather
      # than stored as a secret: nothing outside this job ever needs to unlock it.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/rssquick-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -d > "$p12"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          # -T /usr/bin/codesign plus set-key-partition-list is what lets codesign use the key
          # without a GUI prompt. Omit either and the job hangs until it times out, with nothing
          # in the log to say why.
          security import "$p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null

          # The search list has to include it, or `security find-identity` will not see it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          rm -f "$p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, notarize and staple
        env:
          RSSQUICK_KEYCHAIN: ${{ runner.temp }}/rssquick-signing.keychain-db
          RSSQUICK_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 -d > "$key"
          trap 'rm -f "$key"' EXIT
          export NOTARY_KEY_PATH="$key"

          args=()
          # release.sh runs the tests itself; they already ran above as their own step.
          args+=(--no-test)
          if [ "${{ inputs.notarize }}" = "false" ]; then
            args+=(--no-notarize)
          fi

          macos/build/release.sh "${args[@]}"

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: rssquick-macos
          path: macos/artifacts/*.dmg

      # Draft, not published, and the same draft the Windows release job attaches to. The
      # artefacts want opening with VoiceOver before anyone downloads them, and the release notes
      # want reading before they go out.
      #
      # No generate_release_notes here, unlike release.yml. Both workflows fire on the same tag,
      # and whichever writes the body second wins; only one of them should be claiming to author
      # it. release.yml is that one. In practice it also gets there first - this job spends most
      # of its time waiting on Apple's notary service - so the draft already exists by now and
      # this only adds a file to it.
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: macos/artifacts/*.dmg

      # Runs even when something above failed, so a cancelled or broken run does not leave a
      # keychain holding the signing key on a runner that may be reused.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/rssquick-signing.keychain-db" || true
