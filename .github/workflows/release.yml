name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Architectures to build'
        type: choice
        options: [both, x64, arm64]
        default: both

permissions:
  contents: write   # create the draft release
  id-token: write   # the OIDC token azure/login exchanges for Azure credentials, for signing

jobs:
  package:
    runs-on: windows-latest
    # Runs in the `azure-signing` environment so the OIDC token's subject is
    # repo:kellylford/rssquick:environment:azure-signing, which is what the Azure federated
    # credential trusts - the tenant does not accept wildcard tag subjects. The same arrangement
    # as QuickMail. It is only there to match that claim: add no protection rules to it, or every
    # run will wait for approval. Signing itself still happens only on v* tags, below.
    environment: azure-signing

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Never ship a build the tests have not passed.
      - name: Test
        run: dotnet test --project tests/RSSQuick.Tests/RSSQuick.Tests.csproj --configuration Release

      # The tag is authoritative: a v1.2.0 tag must not publish artefacts stamped 1.1.0.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^v', ''
          $file = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne $file) {
            throw "Tag v$tag does not match VERSION ($file). Run build/prepare-release.ps1 $tag and re-tag."
          }
          Write-Host "Version $file"

      - name: Restore vpk
        run: dotnet tool restore

      # The previous release's full package, so vpk can build a delta against it: an installed
      # copy then downloads the difference rather than the whole 55 MB. The first Velopack
      # release has no predecessor to find, which is what continue-on-error is for - vpk then
      # builds the full package alone, and installed copies download that instead.
      #
      # No --token, on purpose. An authenticated listing includes drafts, so a re-run while this
      # tag's draft exists would fetch this same version and vpk would refuse to pack it, and a
      # delta could be built against a release nobody has published. Unauthenticated, vpk sees
      # exactly what installed copies see: published releases only.
      - name: Download the previous x64 release for delta packages
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: dotnet tool run vpk download github --repoUrl https://github.com/${{ github.repository }} --outputDir artifacts/releases

      - name: Download the previous ARM64 release for delta packages
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: dotnet tool run vpk download github --repoUrl https://github.com/${{ github.repository }} --channel win-arm64 --outputDir artifacts/releases

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Architecture ${{ inputs.architecture || 'both' }} -Step Publish

      # --- Code signing (Azure Artifact Signing via GitHub OIDC) -------------------------------
      # No certificate or long-lived secret is stored: azure/login trades this run's OIDC token
      # for Azure credentials, and both the signing action and vpk's bundled signtool use that
      # session. The same signing account and certificate profile as QuickMail. Tags only, so a
      # manual run produces an unsigned build for trying things out.
      - name: Azure login (code signing)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Before the ZIPs are made, so the portable download carries a signed program too. vpk
      # signs the installer and the updater during packing, and signs its own copy of this one
      # again, which only replaces the signature with an identical one.
      - name: Sign RSSQuick.exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: kellylford
          certificate-profile-name: kellyford-public
          files-folder: ${{ github.workspace }}/artifacts/staging
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # UTF-8 without a byte-order mark, which is what vpk's reader needs; WriteAllText writes that.
      - name: Write signing metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $json = @{
            Endpoint               = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'kellylford'
            CertificateProfileName = 'kellyford-public'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\signing-metadata.json", $json)

      - name: Build the installer, portable ZIP and update feed
        shell: pwsh
        run: |
          $sign = @{}
          if ('${{ github.ref }}' -like 'refs/tags/v*') { $sign.AzureSignFile = "$env:RUNNER_TEMP\signing-metadata.json" }
          ./build/publish.ps1 -Architecture ${{ inputs.architecture || 'both' }} -Step Package -KeepReleaseFeed @sign

      # A tag must never publish an unsigned download: SmartScreen would warn everyone who runs it.
      - name: Check every download is signed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $check = @(Get-ChildItem artifacts\*.exe)
          foreach ($zip in Get-ChildItem artifacts\*.zip) {
            $into = Join-Path $env:RUNNER_TEMP $zip.BaseName
            Expand-Archive $zip.FullName $into -Force
            $check += Get-Item (Join-Path $into 'RSSQuick.exe')
          }
          $bad = $check | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          $check | ForEach-Object { $sig = Get-AuthenticodeSignature $_.FullName; Write-Host "$($sig.Status)  $($sig.SignerCertificate.Subject)  $($_.FullName)" }
          if ($bad) { throw "Not signed: $($bad.FullName -join ', ')" }

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: rssquick-packages
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/releases/*

      # Draft, not published: the artefacts want a manual check with a screen reader before
      # anyone downloads them, and the release notes want reading before they go out.
      #
      # Publishing the draft is also what ships the update. Installed copies read the feed files
      # below from the latest published release, so nothing updates until a person has looked.
      #
      # artifacts/releases/* is the whole update feed for both channels: the packages (full, and
      # delta when there was a previous release), releases.win.json and releases.win-arm64.json,
      # assets.*.json and RELEASES*. It includes the previous version's full package fetched
      # above, which has to go too - the feed lists it. fail_on_unmatched_files, so a change in
      # what vpk writes fails the release instead of publishing one installed copies cannot read.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/releases/*.nupkg
            artifacts/releases/releases.win.json
            artifacts/releases/releases.win-arm64.json
            artifacts/releases/assets.win.json
            artifacts/releases/assets.win-arm64.json
            artifacts/releases/RELEASES
            artifacts/releases/RELEASES-win-arm64
